<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--
    Content-Security-Policy: a safety net for your GitHub token.
    It tells the browser this page may only run its OWN script files (no inline or
    third-party JavaScript) and may only send data to api.github.com. So even if
    something strange ended up in a note, it couldn't run or send your token anywhere.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <!-- Ask search engines not to list this page -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
  <title>Tracker</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <!-- type="module" lets the JS files import each other -->
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- app.js draws everything inside #root -->
  <div id="root"><p class="boot">Loading…</p></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="boot">This tracker needs JavaScript turned on.</p></noscript>
</body>
</html>
